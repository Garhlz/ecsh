[package]
name = "ecsh"
version = "0.1.0"
edition = "2024"
authors = ["Elaine"]
description = "Elaine & Cornelia's shell: a learning-oriented Unix-like shell written in Rust"

[dependencies]
dirs-next = "2.0.0"
libc = "0.2.186"
nix = { version = "0.31.3", features = ["process", "fs", "term", "hostname", "signal"] }
rustyline = "18.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
